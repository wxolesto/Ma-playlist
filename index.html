<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsenous base</title>
  <!-- Hubot Sans Font & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hubot+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- jsColorThief for extraction dynamic colors from artwork -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Hubot Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0d0f12;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 410px;
      height: 100vh;
      max-height: 860px;
      position: relative;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      background: #000;
      display: flex;
      flex-direction: column;
      transition: background 1.2s ease;
    }

    .bg-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: linear-gradient(160deg, #ff6b81 0%, #ff8c42 60%, #1e132b 100%);
      transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      filter: blur(20px);
      scale: 1.1;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
    }

    .app-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      animation: fadeIn 0.4s ease forwards;
    }

    .view.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      margin-bottom: 20px;
    }

    .header-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .sub-text {
      font-size: 13px;
      opacity: 0.6;
      margin-top: 2px;
    }

    .icon-btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
    }

    .artwork-container {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      margin: 20px 0;
      position: relative;
    }

    .artwork-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .track-title { font-size: 22px; font-weight: 700; }
    .track-artist { font-size: 16px; opacity: 0.7; margin-top: 4px; }

    .progress-area { margin-bottom: 25px; }

    .progress-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 30%;
      background: #ffffff;
      border-radius: 10px;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      opacity: 0.6;
      margin-top: 8px;
    }

    .controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 25px;
    }

    .control-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .control-btn:active { transform: scale(0.85); }
    .play-btn { font-size: 38px; }

    .dock {
      border-radius: 30px;
      padding: 10px 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: auto;
    }

    .dock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      opacity: 0.6;
      cursor: pointer;
      gap: 4px;
    }

    .dock-item.active { opacity: 1; font-weight: 700; }
    .dock-item i { font-size: 18px; }

    .action-buttons { display: flex; gap: 15px; margin-bottom: 15px; }

    .pill-btn {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .song-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .song-list::-webkit-scrollbar { display: none; }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .song-item:hover { background: rgba(255, 255, 255, 0.1); }

    .song-item img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
    }

    .song-details { flex: 1; }
    .song-details .title { font-size: 15px; font-weight: 600; }
    .song-details .artist { font-size: 13px; opacity: 0.6; }
    .song-duration { font-size: 12px; opacity: 0.5; }

    .mini-player {
      border-radius: 22px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .mini-player img { width: 40px; height: 40px; border-radius: 10px; }
    .mini-info { flex: 1; }
    .mini-info .title { font-size: 14px; font-weight: 600; }
    .mini-info .artist { font-size: 12px; opacity: 0.6; }

    #file-input { display: none; }

    .file-loader-btn {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="bg-gradient" id="bg-gradient"></div>
    <div class="app-content">
      <div class="view active" id="player-view">
        <div class="header">
          <button class="icon-btn-circle" onclick="switchView('songs-view')"><i class="fa-solid fa-chevron-down"></i></button>
          <span style="font-size:13px; font-weight:600; opacity:0.8;">Arsenous base</span>
          <label for="file-input" class="file-loader-btn"><i class="fa-solid fa-folder-open"></i> Load</label>
          <input type="file" id="file-input" multiple accept="audio/*">
        </div>

        <div class="artwork-container">
          <img id="player-artwork" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80" crossorigin="anonymous" alt="Cover">
        </div>

        <div class="song-info">
          <div>
            <div class="track-title" id="player-title">Slow Mornings</div>
            <div class="track-artist" id="player-artist">Paper Boats</div>
          </div>
          <button class="icon-btn-circle"><i class="fa-solid fa-ellipsis"></i></button>
        </div>

        <div class="progress-area">
          <div class="progress-bar" onclick="seekTrack(event)">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="time-stamps">
            <span id="current-time">1:26</span>
            <span id="total-time">-2:16</span>
          </div>
        </div>

        <div class="controls">
          <button class="control-btn" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
          <button class="control-btn play-btn" onclick="togglePlay()"><i class="fa-solid fa-pause" id="play-icon"></i></button>
          <button class="control-btn" onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
        </div>

        <div class="controls" style="margin-bottom:0; justify-content:space-between; padding:0 20px;">
          <button class="control-btn" style="font-size:16px;"><i class="fa-solid fa-quote-right"></i></button>
          <button class="control-btn" style="font-size:16px;" onclick="toggleRepeat()"><i class="fa-solid fa-repeat" id="repeat-btn"></i></button>
          <button class="control-btn" style="font-size:16px;"><i class="fa-solid fa-list-ul"></i></button>
        </div>
      </div>

      <div class="view" id="songs-view">
        <div class="header">
          <div>
            <div class="header-title">Songs</div>
            <div class="sub-text" id="song-count">248 songs on this phone</div>
          </div>
          <button class="icon-btn-circle"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="action-buttons">
          <div class="pill-btn glass-panel" onclick="shuffleAndPlay()"><i class="fa-solid fa-shuffle"></i> Shuffle</div>
          <div class="pill-btn glass-panel" onclick="playTrack(0)"><i class="fa-solid fa-play"></i> Play</div>
        </div>

        <div class="song-list" id="song-list"></div>

        <div class="mini-player glass-panel" onclick="switchView('player-view')">
          <img id="mini-artwork" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=100&q=80" alt="Cover">
          <div class="mini-info">
            <div class="title" id="mini-title">Slow Mornings</div>
            <div class="artist" id="mini-artist">Paper Boats</div>
          </div>
          <button class="control-btn" onclick="event.stopPropagation(); togglePlay();"><i class="fa-solid fa-pause" id="mini-play-icon"></i></button>
          <button class="control-btn" onclick="event.stopPropagation(); nextTrack();"><i class="fa-solid fa-forward"></i></button>
        </div>

        <div class="dock glass-panel">
          <div class="dock-item active"><i class="fa-solid fa-music"></i><span>Songs</span></div>
          <div class="dock-item"><div style="width:16px; height:16px; border:2px solid #fff; border-radius:50%;"></div><span>Albums</span></div>
          <div class="dock-item"><i class="fa-solid fa-bars-staggered"></i><span>Playlists</span></div>
          <div class="dock-item"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    const colorThief = new ColorThief();

    let tracks = [
      {
        title: "Slow Mornings",
        artist: "Paper Boats",
        duration: "3:42",
        cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80",
        src: ""
      },
      {
        title: "Lantern Hours",
        artist: "Soft Static",
        duration: "4:08",
        cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=500&q=80",
        src: ""
      },
      {
        title: "Tea & Stars",
        artist: "Lantern Club",
        duration: "2:56",
        cover: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&q=80",
        src: ""
      }
    ];

    let currentTrackIndex = 0;
    let isPlaying = false;
    let isRepeat = false;
    const audio = document.getElementById('audio-player');

    document.getElementById('file-input').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      if (files.length > 0) {
        tracks = files.map(file => ({
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "Local Storage",
          duration: "--:--",
          cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80",
          src: URL.createObjectURL(file)
        }));
        renderSongList();
        playTrack(0);
      }
    });

    function renderSongList() {
      const songListEl = document.getElementById('song-list');
      document.getElementById('song-count').innerText = `${tracks.length} songs on this phone`;
      songListEl.innerHTML = '';

      tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.onclick = () => playTrack(index);

        const cover = document.createElement('img');
        cover.src = track.cover;
        cover.alt = 'cover';

        const details = document.createElement('div');
        details.className = 'song-details';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = track.title;
        const artist = document.createElement('div');
        artist.className = 'artist';
        artist.textContent = track.artist;
        details.append(title, artist);

        const duration = document.createElement('div');
        duration.className = 'song-duration';
        duration.textContent = track.duration;
        item.append(cover, details, duration);
        songListEl.appendChild(item);
      });
    }

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function playTrack(index) {
      if (!tracks.length) return;
      currentTrackIndex = index;
      const track = tracks[currentTrackIndex];

      document.getElementById('player-title').innerText = track.title;
      document.getElementById('player-artist').innerText = track.artist;
      document.getElementById('mini-title').innerText = track.title;
      document.getElementById('mini-artist').innerText = track.artist;

      const img = document.getElementById('player-artwork');
      img.src = track.cover;
      document.getElementById('mini-artwork').src = track.cover;

      if (track.src) {
        audio.src = track.src;
        audio.play().catch(() => {});
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }

      updatePlayIcons();
      extractColors(img);
    }

    function extractColors(imgElement) {
      const updateGradient = () => {
        try {
          const colors = colorThief.getPalette(imgElement, 2);
          if (!colors || colors.length < 2) throw new Error('Palette unavailable');
          const c1 = `rgb(${colors[0].join(',')})`;
          const c2 = `rgb(${colors[1].join(',')})`;
          document.getElementById('bg-gradient').style.background =
            `linear-gradient(160deg, ${c1} 0%, ${c2} 70%, #0d0f12 100%)`;
        } catch (e) {
          document.getElementById('bg-gradient').style.background =
            'linear-gradient(160deg, #ff6b81 0%, #ff8c42 60%, #1e132b 100%)';
        }
      };

      if (imgElement.complete && imgElement.naturalWidth) {
        updateGradient();
      } else {
        imgElement.addEventListener('load', updateGradient, { once: true });
      }
    }

    function togglePlay() {
      if (!tracks.length) return;
      const track = tracks[currentTrackIndex];
      if (!track.src) {
        document.getElementById('file-input').click();
        return;
      }

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play().then(() => {
          isPlaying = true;
          updatePlayIcons();
        }).catch(() => {
          isPlaying = false;
          updatePlayIcons();
        });
      }
      updatePlayIcons();
    }

    function updatePlayIcons() {
      const icon = isPlaying ? 'fa-pause' : 'fa-play';
      document.getElementById('play-icon').className = `fa-solid ${icon}`;
      document.getElementById('mini-play-icon').className = `fa-solid ${icon}`;
    }

    function nextTrack() {
      if (!tracks.length) return;
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      playTrack(currentTrackIndex);
    }

    function prevTrack() {
      if (!tracks.length) return;
      currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      playTrack(currentTrackIndex);
    }

    function shuffleAndPlay() {
      if (!tracks.length) return;
      let nextIndex = Math.floor(Math.random() * tracks.length);
      if (tracks.length > 1 && nextIndex === currentTrackIndex) {
        nextIndex = (nextIndex + 1) % tracks.length;
      }
      playTrack(nextIndex);
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      audio.loop = isRepeat;
      document.getElementById('repeat-btn').style.opacity = isRepeat ? '1' : '0.4';
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function updateProgress() {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      document.getElementById('progress-fill').style.width = `${progress}%`;
      document.getElementById('current-time').textContent = formatTime(audio.currentTime);
      document.getElementById('total-time').textContent = `-${formatTime(audio.duration - audio.currentTime)}`;
    }

    function seekTrack(event) {
      if (!audio.duration) return;
      const rect = event.currentTarget.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
      updateProgress();
    }

    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('total-time').textContent = `-${formatTime(audio.duration)}`;
      updateProgress();
      const track = tracks[currentTrackIndex];
      if (track) track.duration = formatTime(audio.duration);
      renderSongList();
    });

    audio.addEventListener('play', () => {
      isPlaying = true;
      updatePlayIcons();
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      updatePlayIcons();
    });

    audio.addEventListener('ended', () => {
      if (!isRepeat) nextTrack();
    });

    renderSongList();
    extractColors(document.getElementById('player-artwork'));
    updatePlayIcons();
  </script>
</body>
</html>
