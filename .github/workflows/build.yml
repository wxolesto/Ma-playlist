name: Build Arsenous Base APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Capacitor & Dependencies
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
        npx cap init "Arsenous base" "com.arsenous.base" --web-dir .

    - name: Add Android Platform
      run: npx cap add android

    - name: Generate App Icon
      run: |
        if [ -f "icon.png" ]; then
          npx capacitor-assets generate --iconSource icon.png
        fi

    - name: Sync Web Code to Android
      run: npx cap sync android

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arsenous-Base-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
 
